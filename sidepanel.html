<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>小红书采集工作台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header -->
  <div class="scraper-header">
    <div class="header-title">
      <img src="logo.png" alt="Logo" class="logo">
      <div class="title-text">
        <h2>小红书采集工作台</h2>
        <span class="subtitle">单篇 · 关键词 · 联想词 · 矩阵 · 评论 · 收藏</span>
      </div>
    </div>
    <div class="header-actions">
      <span id="feishu-status" class="feishu-dot" title="飞书未连接">飞书未连接</span>
    </div>
  </div>

  <!-- Tabs -->
  <div class="scraper-tabs">
    <div class="scraper-tab-item active" data-tab="tab-single">单篇</div>
    <div class="scraper-tab-item" data-tab="tab-keyword">关键词</div>
    <div class="scraper-tab-item" data-tab="tab-suggest">联想词</div>
    <div class="scraper-tab-item" data-tab="tab-matrix">矩阵</div>
    <div class="scraper-tab-item" data-tab="tab-comment">评论</div>
    <div class="scraper-tab-item" data-tab="tab-collect">收藏</div>
    <div class="scraper-tab-item" data-tab="tab-settings">配置</div>
  </div>

  <div class="tab-container">

    <!-- 单篇 -->
    <div id="tab-single" class="tab-content active">
      <div class="control-panel">
        <button class="md-btn md-btn-primary" id="btn-parse-single" style="flex:1;">解析当前笔记</button>
        <button class="md-btn md-btn-outlined" id="btn-sync-single" style="flex:1;">采集到飞书</button>
      </div>
      <div id="single-detail" class="results-area"><div class="empty-state"><div class="empty-state-title">等待解析</div><div class="empty-state-desc">打开一篇小红书笔记后点「解析当前笔记」。</div></div></div>
      <div id="status-single" class="status-line"></div>
    </div>

    <!-- 关键词 -->
    <div id="tab-keyword" class="tab-content">
      <div class="control-panel">
        <div class="panel-row grid">
          <div class="input-wrapper"><label class="md-label">关键词</label><input id="kw-input" class="md-input" placeholder="如：退租清洁"></div>
          <div class="input-wrapper"><label class="md-label">时间</label><select id="kw-time" class="md-input"><option value="">不限</option><option value="time_descending">近30天</option><option value="time_descending_180">近半年</option></select></div>
          <div class="input-wrapper"><label class="md-label">类型</label><select id="kw-type" class="md-input"><option value="0">全部</option><option value="2">图文</option><option value="1">视频</option></select></div>
        </div>
        <div class="panel-row">
          <button class="md-btn md-btn-primary" id="btn-kw-start" style="flex:2;">开始采集</button>
          <button class="md-btn md-btn-outlined" id="btn-kw-sync" style="flex:1.5;">同步飞书</button>
          <button class="md-btn md-btn-outlined md-btn-compact" id="btn-kw-export" title="导出">导出</button>
        </div>
        <div id="kw-progress" class="status-line"></div>
      </div>
      <div class="results-area" id="kw-list"><div class="empty-state"><div class="empty-state-title">还没有数据</div><div class="empty-state-desc">输入关键词后开始采集。</div></div></div>
    </div>

    <!-- 联想词 -->
    <div id="tab-suggest" class="tab-content">
      <div class="control-panel">
        <div class="input-wrapper"><label class="md-label">关键词（每行一个）</label><textarea id="suggest-input" class="md-textarea" rows="4" placeholder="退租清洁&#10;开荒保洁"></textarea></div>
        <div class="panel-row">
          <button class="md-btn md-btn-primary" id="btn-suggest" style="flex:2;">采集联想词</button>
          <button class="md-btn md-btn-outlined" id="btn-suggest-sync" style="flex:1.5;">同步飞书</button>
          <button class="md-btn md-btn-outlined md-btn-compact" id="btn-suggest-export" title="导出">导出</button>
        </div>
      </div>
      <div class="results-area" id="suggest-list"><div class="empty-state"><div class="empty-state-title">还没有数据</div></div></div>
    </div>

    <!-- 矩阵 -->
    <div id="tab-matrix" class="tab-content">
      <div class="control-panel">
        <div class="panel-row grid">
          <div class="input-wrapper"><label class="md-label">账号名</label><input id="matrix-name" class="md-input" placeholder="如：小号A"></div>
          <button class="md-btn md-btn-primary" id="btn-matrix-save" style="flex:1;">保存当前账号</button>
        </div>
        <div class="mode-hint">切换账号后会清空并注入对应 cookie，请手动刷新小红书标签页。</div>
      </div>
      <div class="results-area" id="matrix-list"><div class="empty-state"><div class="empty-state-title">还没有存档账号</div></div></div>
    </div>

    <!-- 评论 -->
    <div id="tab-comment" class="tab-content">
      <div class="scraper-subtabs">
        <div class="sub-tab active" data-sub="cur">当前笔记</div>
        <div class="sub-tab" data-sub="batch">批量链接</div>
      </div>
      <div id="comment-cur" class="sub-content active">
        <button class="md-btn md-btn-primary" id="btn-comment-cur" style="width:100%;">采集当前笔记评论</button>
        <div id="comment-cur-result" class="results-area" style="margin-top:8px;"></div>
      </div>
      <div id="comment-batch" class="sub-content">
        <div class="input-wrapper"><label class="md-label">笔记链接（每行一个）</label><textarea id="comment-urls" class="md-textarea" rows="4" placeholder="https://www.xiaohongshu.com/explore/xxxxx"></textarea></div>
        <div class="panel-row">
          <label class="toggle-wrapper"><span class="toggle-label">热门优先</span><input type="checkbox" id="comment-hot" class="toggle-input" checked></label>
          <label class="toggle-wrapper"><span class="toggle-label">含回复</span><input type="checkbox" id="comment-reply" class="toggle-input"></label>
        </div>
        <div class="panel-row">
          <button class="md-btn md-btn-primary" id="btn-comment-add" style="flex:1.5;">加入队列</button>
          <button class="md-btn md-btn-outlined" id="btn-comment-run" style="flex:1;">开始</button>
          <button class="md-btn md-btn-outlined" id="btn-comment-pause" style="flex:1;">暂停</button>
          <button class="md-btn md-btn-outlined" id="btn-comment-sync" style="flex:1.5;">同步飞书</button>
        </div>
        <div class="results-area" id="comment-queue"></div>
      </div>
    </div>

    <!-- 收藏 -->
    <div id="tab-collect" class="tab-content">
      <div class="control-panel">
        <button class="md-btn md-btn-primary" id="btn-collect-load" style="flex:1;">读取当前收藏列表</button>
        <button class="md-btn md-btn-outlined" id="btn-collect-sync" style="flex:1;">同步飞书</button>
        <button class="md-btn md-btn-outlined md-btn-compact" id="btn-collect-export" title="导出">导出</button>
      </div>
      <div id="collect-count" class="status-line"></div>
      <div class="results-area" id="collect-list"><div class="empty-state"><div class="empty-state-title">还没有数据</div><div class="empty-state-desc">点击「读取当前收藏列表」，在小红书收藏页下手动勾选要采集的笔记。</div></div></div>
    </div>

    <!-- 配置 -->
    <div id="tab-settings" class="tab-content">
      <div class="settings-block">
        <h3>飞书连接</h3>
        <div class="input-wrapper"><label class="md-label">Bearer Token</label><input id="cfg-bearer" class="md-input"></div>
        <div class="input-wrapper"><label class="md-label">多维表格链接 / Base Token</label><input id="cfg-link" class="md-input" placeholder="https://xxx.feishu.cn/base/xxxx"></div>
        <div class="input-wrapper"><label class="md-label">博主表 ID</label><input id="cfg-profile" class="md-input"></div>
        <div class="input-wrapper"><label class="md-label">笔记表 ID</label><input id="cfg-note" class="md-input"></div>
        <div class="input-wrapper"><label class="md-label">评论表 ID</label><input id="cfg-comment" class="md-input"></div>
        <div class="input-wrapper"><label class="md-label">联想词表 ID</label><input id="cfg-suggest" class="md-input"></div>
        <div class="input-wrapper"><label class="md-label">日常采集库 ID</label><input id="cfg-daily" class="md-input"></div>
        <button class="md-btn md-btn-primary" id="btn-cfg-save" style="width:100%;margin-top:6px;">保存配置</button>
      </div>

      <div class="settings-block">
        <h3>本地转写（OCR）</h3>
        <div id="ocr-status" class="status-line">未加载</div>
        <button class="md-btn md-btn-primary" id="btn-ocr-load" style="width:100%;">一键启动并连接（下载识别模型）</button>
        <div class="mode-hint">首次会从 CDN 下载中文识别模型（约 10MB），仅本地运行，不上传。</div>
      </div>

      <div class="settings-block">
        <h3>本地缓存</h3>
        <div id="cache-status" class="status-line"></div>
        <button class="md-btn md-btn-outlined" id="btn-cache-clear" style="width:100%;">清理缓存</button>
      </div>

      <div class="settings-block">
        <h3>高级</h3>
        <div class="input-wrapper"><label class="md-label">签名服务器（可选，留空走登录态实时头）</label><input id="cfg-sign" class="md-input" placeholder="http://你的签名服务/xhs/headers"></div>
        <div class="input-wrapper"><label class="md-label">采集间隔(秒)</label><input id="cfg-delay" type="number" class="md-input" value="6"></div>
        <button class="md-btn md-btn-outlined" id="btn-adv-save" style="width:100%;margin-top:6px;">保存高级</button>
      </div>
    </div>

  </div>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="modules/cache.js"></script>
  <script src="modules/feishu.js"></script>
  <script src="modules/exporter.js"></script>
  <script src="modules/suggest.js"></script>
  <script src="modules/matrix.js"></script>
  <script src="modules/comments-queue.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
